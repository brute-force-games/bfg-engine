<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyBase SQLite WASM Export</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 30px;
        }
        h1 {
            color: #4ec9b0;
            margin-bottom: 10px;
        }
        p {
            color: #858585;
            margin-bottom: 30px;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover:not(:disabled) {
            background: #1177bb;
        }
        button:disabled {
            background: #3e3e42;
            color: #858585;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            background: #1e1e1e;
            border-radius: 4px;
            font-size: 12px;
            color: #858585;
        }
        .status.success {
            color: #4ec9b0;
        }
        .status.error {
            color: #f48771;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TinyBase SQLite Demo</h1>
        <p>Data is persisted to an in-memory SQLite WASM database.</p>

        <button id="exportButton" disabled>Download SQLite DB File</button>
        
        <div id="status" class="status"></div>
    </div>

    <script type="module" src="./sqlite-export-demo.ts"></script>
</body>
</html>
